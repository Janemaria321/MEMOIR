<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoir - Welcome</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: 'Calibri', sans-serif; /* Changed to Calibri font */
        }

        .welcome-text {
            font-size: 6rem; /* Increased size */
            font-weight: bold;
            color: rgb(49, 152, 49);
            text-shadow: 0 0 5px purple, 0 0 10px purple, 0 0 15px purple, 0 0 20px purple;
            animation: glow 1.5s infinite alternate;
        }

        .memory-lane {
            font-size: 12px;
            color: grey;
            margin-top: 10px; /* Space between the two lines */
        }

        .play-button {
            margin-top: 20px; /* Space between text and button */
            padding: 15px 30px;
            background-color: rgb(45, 140, 45); /* Green color for the button */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none; /* Remove underline from link */
            display: inline-block;
        }

        .play-button:hover {
            background-color: rgb(50, 128, 50); /* Darker green on hover */
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px purple, 0 0 10px purple, 0 0 15px purple, 0 0 20px purple;
            }
            to {
                text-shadow: 0 0 10px purple, 0 0 20px purple, 0 0 30px purple, 0 0 40px purple;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-text">Memoir</div>
    <div class="memory-lane">A walk down memory lane...</div>
    <!-- Link the Play button to the login page -->
    <a href="login.html">
        <button class="play-button">START</button>
    </a>
</body>
</html>
